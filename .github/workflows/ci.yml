name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.9'

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------- tests ----
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: API package tests
        working-directory: packages/khinsider_api
        run: |
          dart pub get
          dart analyze
          dart test
      - name: App analyze + tests
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  # ------------------------------------------------------------ version ----
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------ android ----
  # Android APK incl. ARMv7 for old TV boxes / Google TV.
  build-android:
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Configure Android signing
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            KEYSTORE_EXT="${ANDROID_KEYSTORE_TYPE:-JKS}"
            KEYSTORE_EXT="${KEYSTORE_EXT,,}"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "android/app/upload-keystore.$KEYSTORE_EXT"
            {
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "storeFile=upload-keystore.$KEYSTORE_EXT"
              echo "storeType=${ANDROID_KEYSTORE_TYPE:-JKS}"
            } > android/key.properties
          else
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "ERROR: refusing to publish a release tag without Android signing secrets." >&2
              exit 1
            fi
            echo "Android signing secrets are not configured; using the debug signing fallback."
          fi
      - name: Build fat APK (armv7 + arm64)
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ github.run_number }}
      - name: Build split APKs (smaller downloads)
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ github.run_number }}
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             dist/khinsider-${{ needs.version.outputs.version }}-universal.apk
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             dist/khinsider-${{ needs.version.outputs.version }}-armv7.apk
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             dist/khinsider-${{ needs.version.outputs.version }}-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/

  # -------------------------------------------------------------- macos ----
  build-macos:
    needs: [test, version]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          # media_kit fetches prebuilt native libs at configure time and aborts
          # with "Integrity check failed, please try to re-build project again"
          # when that download comes back short. Retrying after a clean keeps a
          # transient network hiccup from costing a whole release.
          flutter build macos --release \
            --build-name=${{ needs.version.outputs.version }} \
            || (flutter clean && flutter pub get && \
                flutter build macos --release \
                  --build-name=${{ needs.version.outputs.version }})
      - name: Create DMG + zip app bundle
        run: |
          mkdir -p dist
          cd app/build/macos/Build/Products/Release
          hdiutil create -volname KHInsider \
            -srcfolder khinsider.app \
            -ov -format UDZO \
            "$GITHUB_WORKSPACE/dist/khinsider-${{ needs.version.outputs.version }}-macos.dmg"
          ditto -c -k --sequesterRsrc --keepParent khinsider.app \
            "$GITHUB_WORKSPACE/dist/khinsider-${{ needs.version.outputs.version }}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/

  # ----------------------------------------------------------------- ios ----
  # Unsigned IPA — install via AltStore / Sideloadly / TrollStore, or open
  # in Xcode for device signing. (CI has no Apple signing identity.)
  build-ios:
    needs: [test, version]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build (unsigned)
        working-directory: app
        run: |
          flutter pub get
          # media_kit fetches prebuilt native libs at configure time and aborts
          # with "Integrity check failed, please try to re-build project again"
          # when that download comes back short. Retrying after a clean keeps a
          # transient network hiccup from costing a whole release.
          flutter build ios --release --no-codesign \
            --build-name=${{ needs.version.outputs.version }} \
            || (flutter clean && flutter pub get && \
                flutter build ios --release --no-codesign \
                  --build-name=${{ needs.version.outputs.version }})
      - name: Package unsigned IPA
        run: |
          mkdir -p dist Payload
          cp -R app/build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qr dist/khinsider-${{ needs.version.outputs.version }}-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/

  # ------------------------------------------------------------ windows ----
  build-windows:
    needs: [test, version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        shell: bash
        run: |
          flutter pub get
          # media_kit fetches prebuilt native libs at configure time and aborts
          # with "Integrity check failed, please try to re-build project again"
          # when that download comes back short. Retrying after a clean keeps a
          # transient network hiccup from costing a whole release.
          flutter build windows --release \
            --build-name=${{ needs.version.outputs.version }} \
            || (flutter clean && flutter pub get && \
                flutter build windows --release \
                  --build-name=${{ needs.version.outputs.version }})
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "app/build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/khinsider-${{ needs.version.outputs.version }}-windows.zip" -Force
      - name: Build Inno Setup installer (single setup exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:APP_VERSION = "${{ needs.version.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:APP_VERSION packaging/windows/khinsider.iss
          Copy-Item "packaging/khinsider-*-windows-setup.exe" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/

  # ------------------------------------------------------ linux (flatpak) --
  build-linux:
    needs: [test, version]
    runs-on: ubuntu-22.04   # older glibc = compatible with the Deck runtime
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          # media_kit's linux libs are fetched at configure time and the plugin
          # aborts with "Integrity check failed, please try to rebuild project
          # again" when that download comes back short. One clean retry keeps a
          # network hiccup from costing a whole release.
          flutter build linux --release \
            --build-name=${{ needs.version.outputs.version }} \
            || (flutter clean && flutter pub get && \
                flutter build linux --release \
                  --build-name=${{ needs.version.outputs.version }})
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: app/build/linux/x64/release/bundle/

  flatpak-steamdeck:
    needs: [build-linux, version]
    runs-on: ubuntu-latest
    container:
      # Provides the flatpak CLI toolchain (build-init/finish/export/bundle).
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-23.08
      options: --privileged
    steps:
      - name: Container prerequisites (machine-id)
        run: |
          echo "machine-id-khinsider" > /etc/machine-id
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: linux-bundle
      - name: Stamp version into metainfo
        run: |
          sed -i "s/@VERSION@/${{ needs.version.outputs.version }}/g" \
            packaging/flatpak/dev.khinsider.app.metainfo.xml
          sed -i "s/@DATE@/$(date +%Y-%m-%d)/g" \
            packaging/flatpak/dev.khinsider.app.metainfo.xml
      - name: Install runtime + SDK
        run: |
          flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --system flathub \
            org.freedesktop.Platform/x86_64/24.08 \
            org.freedesktop.Sdk/x86_64/24.08
      - name: Assemble app dir (prebuilt bundle, no sandbox build)
        run: |
          flatpak build-init appdir dev.khinsider.app \
            org.freedesktop.Sdk org.freedesktop.Platform 24.08
          mkdir -p appdir/files/bin \
            appdir/files/share/applications \
            appdir/files/share/metainfo \
            appdir/files/share/icons/hicolor/128x128/apps
          cp -r linux-bundle appdir/files/khinsider
          chmod +x appdir/files/khinsider/khinsider
          printf '#!/bin/sh\ncd /app/khinsider && exec ./khinsider "$@"\n' \
            > appdir/files/bin/khinsider
          chmod +x appdir/files/bin/khinsider
          cp packaging/flatpak/dev.khinsider.app.desktop \
            appdir/files/share/applications/dev.khinsider.app.desktop
          cp packaging/flatpak/dev.khinsider.app.metainfo.xml \
            appdir/files/share/metainfo/dev.khinsider.app.metainfo.xml
          cp packaging/flatpak/icons/hicolor/128x128/apps/dev.khinsider.app.png \
            appdir/files/share/icons/hicolor/128x128/apps/dev.khinsider.app.png
      - name: Finish (permissions + metadata)
        run: |
          flatpak build-finish appdir \
            --command=khinsider \
            --share=ipc --share=network \
            --socket=x11 --socket=wayland --socket=pulseaudio \
            --device=dri \
            --talk-name=org.freedesktop.Flatpak
      - name: Export repo + build single-file bundle
        run: |
          flatpak build-export repo appdir
          flatpak build-bundle repo \
            khinsider-${{ needs.version.outputs.version }}-steamdeck.flatpak \
            dev.khinsider.app
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-steamdeck
          path: khinsider-*.flatpak

  # ------------------------------------------------------------- release --
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-ios, build-macos, build-windows, flatpak-steamdeck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{android-apk,ios-ipa,macos-dist,windows-dist,flatpak-steamdeck}'
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install notes

            **Android / TV box / Google TV** — sideload the APK:
            `armv7` for old boxes, `arm64` for modern ones, `universal` if unsure.

            **macOS** — unzip and run; unsigned build, so first launch needs:
            `xattr -cr khinsider.app`

            **Windows** — unzip and run `khinsider.exe` (SmartScreen warning is
            expected for unsigned builds).

            **iOS** — the IPA is unsigned: sideload with AltStore / Sideloadly /
            TrollStore (7-day free signing with a personal Apple ID, or use a
            paid developer account for longer).

            **Steam Deck / Linux** — desktop mode, then:
            `flatpak install --user ./khinsider-*.flatpak`
            (also add it to Steam via "Add a Non-Steam Game" for Gaming Mode)
