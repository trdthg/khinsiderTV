name: khinsider_api
description: >-
  KHInsider HTML parser & data API. Pure Dart implementation (dio + html),
  UI-agnostic and Flutter-free so it can be reused on any platform
  (mobile / desktop / embedded, e.g. future Nintendo Switch port).
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.0
  dio: ^5.7.0
  html: ^0.15.5

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
